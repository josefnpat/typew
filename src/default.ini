; typew default configuration
; Place this file at ~/.config/typew/config or pass --config FILE / -c FILE

; Seconds to wait before writing the buffer to disk (default 1.5)
save_delay = 1.5

; Character(s) written at the end of each line (default \n)
; Options: \n, \r\n, \r, or a literal string
line_endings = \n

; Ring the terminal bell near the end of the writable line (default true)
eol_bell = true

; How many characters away from the line end the bell rings (default 8)
bell_count = 8

; Maximum line length / right margin (default 80)
line_length = 80

; How many lines the return key advances (default 1)
line_space = 1

; Character used to mark an overwritten position (default #)
; Typing over an existing character replaces it with this character.
overwrite = #
